# One web service: builds the React app, then Flask serves it together with the API.
services:
  - type: web
    name: medeasy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: gunicorn backend.app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Free instances have no persistent disk; attach one and point this at it to keep accounts/reports.
      - key: DATABASE_PATH
        value: /opt/render/project/src/backend/data/medeasy.db
